syntax = "proto3";

package distdb;

// ============================================================================
//  Serviço do banco de dados chave-valor distribuído
//
//  Este arquivo é o CONTRATO da comunicação: define, num único lugar, todas
//  as RPCs e mensagens que circulam entre cliente e nós e entre os próprios
//  nós. A partir dele o gRPC gera o código Python (stubs) usado por node.py
//  e client.py (rode scripts/generate_protos.py após qualquer edição).
//
//  Todos os nós implementam ESTE MESMO serviço. Um nó pode agir como LÍDER
//  (coordenador das escritas) ou RÉPLICA (participante), e o papel muda em
//  tempo de execução pela eleição.
//
//  Grupos de RPCs:
//    * API do cliente ........ Put / Get / Update / Delete / leituras
//    * Two-Phase Commit ...... Prepare / Commit / Abort / QueryDecision
//    * Coordenação ........... Heartbeat / Election / Announce / WhoIsLeader
//    * Recuperação ........... SyncState (transferência de estado)
// ============================================================================
service DatabaseService {
  // ---- API do cliente (escritas vão para o líder) ----
  rpc Put     (WriteRequest)  returns (WriteResponse);
  rpc Update  (WriteRequest)  returns (WriteResponse);
  rpc Delete  (DeleteRequest) returns (WriteResponse);
  rpc Get     (GetRequest)    returns (GetResponse);
  rpc Exists  (KeyRequest)    returns (ExistsResponse);
  rpc ListKeys(EmptyRequest)  returns (ListKeysResponse);
  rpc Size    (EmptyRequest)  returns (SizeResponse);
  rpc GetAll  (EmptyRequest)  returns (GetAllResponse);

  // ---- Two-Phase Commit (líder -> réplicas) ----
  rpc Prepare (PrepareRequest) returns (VoteResponse);
  rpc Commit  (DecisionRequest) returns (AckResponse);
  rpc Abort   (DecisionRequest) returns (AckResponse);
  // Protocolo de terminação: um participante "em dúvida" (preparado, com o
  // coordenador morto) pergunta aos peers o que foi decidido da transação.
  rpc QueryDecision (DecisionQuery) returns (DecisionInfo);

  // ---- Coordenação do cluster ----
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
  rpc Election  (ElectionRequest)  returns (ElectionResponse);
  rpc Announce  (CoordinatorMsg)   returns (AckResponse);
  rpc WhoIsLeader(EmptyRequest)    returns (LeaderInfo);

  // ---- Recuperação / controle de réplicas ----
  rpc SyncState (SyncRequest) returns (SyncResponse);
}

// ----------------------------------------------------------------------------
//  Comum
// ----------------------------------------------------------------------------
message EmptyRequest {
  int64 timestamp = 1;        // relógio de Lamport do remetente
}

// Status devolvido nas escritas. NOT_LEADER permite ao cliente que falou com
// a réplica errada seguir o redirecionamento até o líder.
enum Status {
  OK         = 0;
  NOT_LEADER = 1;   // o nó contatado não é o líder; veja leader_address
  KEY_ABSENT = 2;   // a operação exigia uma chave que não existe
  ABORTED    = 3;   // transação distribuída abortada
  ERROR      = 4;   // falha genérica
}

// ----------------------------------------------------------------------------
//  API do cliente
// ----------------------------------------------------------------------------
message WriteRequest {
  string key       = 1;
  string value     = 2;
  int64  timestamp = 3;       // relógio de Lamport do cliente
}

message WriteResponse {
  Status status         = 1;
  string message        = 2;
  int64  timestamp      = 3;  // relógio do líder após a operação
  string leader_address = 4;  // preenchido quando status == NOT_LEADER
}

message DeleteRequest {
  string key       = 1;
  int64  timestamp = 2;
}

message GetRequest {
  string key       = 1;
  int64  timestamp = 2;
}

message GetResponse {
  Status status    = 1;
  bool   found     = 2;
  string value     = 3;
  int64  timestamp = 4;
}

message KeyRequest {
  string key       = 1;
  int64  timestamp = 2;
}

message ExistsResponse {
  bool  exists    = 1;
  int64 timestamp = 2;
}

message ListKeysResponse {
  repeated string keys = 1;
  int64 timestamp      = 2;
}

message SizeResponse {
  int32 size      = 1;
  int64 timestamp = 2;
}

message KeyValue {
  string key   = 1;
  string value = 2;
}

message GetAllResponse {
  repeated KeyValue items = 1;
  int64 timestamp         = 2;
}

// ----------------------------------------------------------------------------
//  Two-Phase Commit
// ----------------------------------------------------------------------------
enum OpType {
  OP_PUT    = 0;
  OP_UPDATE = 1;
  OP_DELETE = 2;
}

message PrepareRequest {
  string tx_id     = 1;       // id único da transação
  OpType op        = 2;
  string key       = 3;
  string value     = 4;
  int64  timestamp = 5;       // relógio de Lamport do coordenador
}

message VoteResponse {
  string tx_id     = 1;
  bool   vote_commit = 2;     // true = SIM/preparado, false = NÃO/abortar
  string reason    = 3;
  int64  timestamp = 4;
}

message DecisionRequest {
  string tx_id     = 1;
  int64  timestamp = 2;
}

message AckResponse {
  bool  ack       = 1;
  int64 timestamp = 2;
}

message DecisionQuery {
  string tx_id     = 1;
  int32  node_id   = 2;       // quem está perguntando
  int64  timestamp = 3;
}

message DecisionInfo {
  string tx_id     = 1;
  string decision  = 2;       // "COMMIT" | "ABORT" | "UNKNOWN"
  int64  timestamp = 3;
}

// ----------------------------------------------------------------------------
//  Coordenação: heartbeat + eleição (Bully)
// ----------------------------------------------------------------------------
message HeartbeatRequest {
  int32 node_id    = 1;       // id do remetente
  int32 leader_id  = 2;       // quem o remetente acha que é o líder (-1 = ninguém)
  int64 timestamp  = 3;
}

message HeartbeatResponse {
  bool  alive      = 1;
  int32 node_id    = 2;
  int32 leader_id  = 3;
  int64 timestamp  = 4;
}

message ElectionRequest {
  int32 node_id    = 1;       // id de quem iniciou/propagou a eleição
  int64 timestamp  = 2;
}

message ElectionResponse {
  bool  alive      = 1;       // "estou vivo e tenho id maior: desista"
  int32 node_id    = 2;
  int64 timestamp  = 3;
}

message CoordinatorMsg {
  int32 leader_id  = 1;       // o líder recém-eleito
  int64 timestamp  = 2;
}

message LeaderInfo {
  int32  leader_id      = 1;
  string leader_address = 2;
  int64  timestamp      = 3;
}

// ----------------------------------------------------------------------------
//  Recuperação / controle de réplicas
// ----------------------------------------------------------------------------
message SyncRequest {
  int32 node_id    = 1;       // nó pedindo para se atualizar
  int64 timestamp  = 2;
}

message SyncResponse {
  repeated KeyValue items = 1; // estado commitado completo do nó
  int64 timestamp         = 2;
  int64 last_commit_ts    = 3; // carimbo (Lamport) da última tx commitada
                               // (deixa o vencedor da eleição detectar
                               //  peers com estado mais novo)
}
